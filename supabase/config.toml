# Lehmfront (P20). Fuer die Supabase-CLI; das Projekt selbst wird im Dashboard angelegt (siehe docs/online.md).
project_id = "lehmfront"

[auth]
enable_signup = true
enable_anonymous_sign_ins = true
site_url = "https://hjorven.github.io/lehmfront/"
additional_redirect_urls = ["http://localhost:8080/"]

[functions.join]
verify_jwt = true

[functions.resolve]
verify_jwt = true

[functions.submit-daily]
