# Lehmfront (P20). Fuer die Supabase-CLI; Projekt-Ref trxetnkronmurxqcrhit (siehe docs/online.md).
# verify_jwt aus: die Functions pruefen die Anmeldung selbst (auth.getUser), das Projekt nutzt ES256-Tokens.
project_id = "lehmfront"

[auth]
enable_signup = true
enable_anonymous_sign_ins = true
site_url = "https://hjorven.github.io/lehmfront/"
additional_redirect_urls = ["https://hjorven.github.io/lehmfront/?scene=fernamt", "http://localhost:8080/", "http://localhost:8080/?scene=fernamt"]

[functions.join]
verify_jwt = false

[functions.resolve]
verify_jwt = false

[functions.submit-daily]
verify_jwt = false
