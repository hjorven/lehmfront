name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regeltests
        run: npm test
      - name: Browser-Pruefung (Konsolenfehler, fehlende Dateien)
        run: |
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps chromium
          node tools/shot.mjs --check
          node tools/shot.mjs --check --path "/?scene=papier"
          node tools/shot.mjs --check --path "/?scene=karte"
          node tools/shot.mjs --check --path "/?scene=karte&night=1"
          node tools/shot.mjs --check --path "/?scene=etappe"
          node tools/shot.mjs --check --path "/?scene=gefecht"
          node tools/shot.mjs --check --path "/?scene=gefecht&demo=bericht"
          node tools/shot.mjs --check --path "/?scene=gefecht&mode=hotseat&demo=uebergabe&night=1"
          node tools/shot.mjs --check --path "/?scene=gefecht-frei"
          node tools/shot.mjs --check --path "/?scene=tageslage&tag=20261109"
          node tools/shot.mjs --check --path "/?scene=gefecht&karte=zufall&kseed=7&runden=8&demo=ende"
