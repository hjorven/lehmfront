name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regeltests
        run: npm test
      - name: Browser-Pruefung (Konsolenfehler, fehlende Dateien)
        run: |
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps chromium
          node tools/shot.mjs --check
