name: Tests und Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regeltests
        run: npm test
      - name: Browser-Pruefung (Konsolenfehler, fehlende Dateien)
        run: |
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps chromium
          node tools/shot.mjs --check

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen (nur was der Browser braucht)
        run: |
          mkdir _site
          for p in index.html sw.js manifest.webmanifest css js assets data vendor; do
            if [ -e "$p" ]; then cp -r "$p" _site/; fi
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
